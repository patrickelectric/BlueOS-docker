[package]
name = "blueos-idl"
description = "BlueOS interface types, generated from ROS 2 interface files, and their CDR encoding"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
byteorder = { workspace = true }
cdr-encoding = { workspace = true }
roslibrust = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
smart-default = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }

# The generated code uses them through a derive path and a serde(with) string, which machete cannot see.
[package.metadata.cargo-machete]
ignored = ["serde_bytes", "smart-default"]

[lints]
workspace = true
