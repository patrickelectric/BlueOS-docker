[workspace]
resolver = "3"
members = ["libs/idl", "libs/idl/codegen", "libs/service"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
blueos-idl = { path = "libs/idl" }
blueos-service = { path = "libs/service" }
byteorder = "1.5"
cdr-encoding = "0.11"
clap = { version = "4.5", features = ["derive", "env"] }
proptest = "1.7"
roslibrust = { version = "0.26", default-features = false }
roslibrust_codegen = "=0.26.0"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = { version = "1", features = ["preserve_order"] }
smart-default = "0.7"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = "1"
zenoh = { version = "=1.9.0", default-features = false, features = ["transport_tcp"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
strip = true
