[workspace]
resolver = "3"
members = ["libs/idl", "libs/idl/codegen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
blueos-idl = { path = "libs/idl" }
byteorder = "1.5"
cdr-encoding = "0.11"
proptest = "1.7"
roslibrust = { version = "0.26", default-features = false }
roslibrust_codegen = "=0.26.0"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
smart-default = "0.7"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
strip = true
